// =========================================================
// PROJECT LIST met drag & drop + kleur selectie
// =========================================================
function ProjectList({ projects, activeSession, todayPerProject, editingId, editName, editColorHex, onEdit, onEditName, onEditColorHex, onRename, onCancelEdit, onDelete, onSwitch, onReorder }) {
  const dragId = useRef(null);
  const [dragOverId, setDragOverId] = useState(null);

  if (projects.length === 0) return <div className="empty-state">Nog geen projecten. Voeg er hieronder een toe.</div>;

  // Is de actieve editColorHex een vaste swatch of een eigen kleur?
  const isCustomColor = editColorHex && !COLORS.some(c => c.dot === editColorHex);

  return (
    <div>
      {projects.map((p, i) => {
        const col = getProjectColor(p, i);
        const ms = todayPerProject.get(p.id) || 0;
        const isActive = activeSession && activeSession.projectId === p.id;
        const isEditing = editingId === p.id;
        const isDragOver = dragOverId === p.id;

        return (
          <div
            key={p.id}
            className={`project-row ${isEditing ? 'is-editing' : ''} ${isDragOver ? 'drag-over' : ''}`}
            style={{ background: isActive ? col.soft : 'transparent', borderColor: isActive && !isDragOver ? col.ring : isDragOver ? 'var(--border-strong)' : 'transparent' }}
            draggable={!isEditing}
            onDragStart={(e) => { dragId.current = p.id; e.dataTransfer.effectAllowed = 'move'; }}
            onDragEnd={() => { dragId.current = null; setDragOverId(null); }}
            onDragOver={(e) => { e.preventDefault(); if (dragId.current && dragId.current !== p.id) setDragOverId(p.id); }}
            onDragLeave={() => setDragOverId(null)}
            onDrop={(e) => { e.preventDefault(); if (dragId.current && dragId.current !== p.id) onReorder(dragId.current, p.id); setDragOverId(null); dragId.current = null; }}
          >
            {!isEditing && <span className="drag-handle" title="Versleep om te herordenen"><Grip size={14}/></span>}
            <span className="project-mini" style={{ background: col.dot, boxShadow: isActive ? `0 0 8px ${col.ring}` : 'none', animation: isActive ? 'pulse 2s ease-in-out infinite' : 'none' }} />

            {isEditing ? (
              <>
                {/* Naam + opslaan/annuleer */}
                <input
                  autoFocus value={editName}
                  onChange={e => onEditName(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') onRename(p.id, editName, editColorHex); if (e.key === 'Escape') onCancelEdit(); }}
                  style={{flex:1,background:'transparent',border:'none',borderBottom:`1px solid ${C.border}`,outline:'none',color:C.textPrimary,fontSize:'1rem',padding:'2px 0'}}
                />
                <button className="icon-btn" onClick={() => onRename(p.id, editName, editColorHex)} title="Opslaan"><Check size={14}/></button>
                <button className="icon-btn" onClick={onCancelEdit} title="Annuleer"><XSmall size={14}/></button>
                {/* Kleur-swatcher (volledige breedte) */}
                <div className="color-swatches">
                  {COLORS.map((c) => (
                    <button
                      key={c.dot}
                      className={`color-swatch ${editColorHex === c.dot ? 'selected' : ''}`}
                      style={{ background: c.dot }}
                      onClick={() => onEditColorHex(c.dot)}
                      title={c.dot}
                    />
                  ))}
                  {/* Eigen kleur-input */}
                  <div
                    className={`color-input-wrap ${isCustomColor ? 'custom-active' : ''}`}
                    style={{ background: isCustomColor ? editColorHex : 'transparent' }}
                    title="Eigen kleur kiezen"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={isCustomColor ? '#fff' : 'var(--text-tertiary)'} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4l3 3"/><circle cx="18" cy="6" r="4"/><path d="M18 4v4"/><path d="M16 6h4"/>
                    </svg>
                    <input
                      type="color"
                      value={isCustomColor ? editColorHex : '#b45309'}
                      onChange={e => onEditColorHex(e.target.value)}
                      title="Eigen kleur"
                    />
                  </div>
                </div>
              </>
            ) : (
              <>
                <button className="project-name-btn" onClick={() => onSwitch(p.id)} style={{ color: isActive ? C.textPrimary : C.textSecondary }}>{p.name}</button>
                <span className="project-time" style={{ color: ms > 0 ? C.textTertiary : C.textDisabled }}>{ms > 0 ? formatHMS(ms) : '—'}</span>
                <div className="row-actions">
                  <button className="icon-btn" onClick={() => onEdit(p.id, p.name, p.colorHex || COLORS[i % COLORS.length].dot)} title="Bewerk"><Pencil size={13}/></button>
                  <button className="icon-btn" onClick={() => onDelete(p.id)} title="Verwijderen"><Trash2 size={13}/></button>
                </div>
                {!isActive && <button className="play-btn" onClick={() => onSwitch(p.id)} style={{ color: col.dot, background: col.soft }} title="Start"><Play size={13} fill={col.dot}/></button>}
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

// =========================================================
// CHECK-IN DIALOG
// =========================================================
function CheckInDialog({ time, projectId, projects, mode, onContinue, onSwitchMode, onSwitch, onStop, onCancelSwitch }) {
  const project = projects.find(p => p.id === projectId);
  const projIdx = projects.findIndex(p => p.id === projectId);
  const col = project ? getProjectColor(project, projIdx) : null;

  return (
    <div className="checkin-overlay" onClick={(e) => { if (e.target === e.currentTarget) onContinue(); }}>
      <div className="checkin-dialog">
        {mode === 'ask' && (
          <>
            <div className="checkin-time">Check-in · {formatTimeShort(time)}</div>
            <h3 className="checkin-question">Ben je nog bezig met dit project?</h3>
            <div className="checkin-active" style={{ background: col?.soft || C.surfaceSunken, border: col ? `1px solid ${col.ring}` : `1px solid var(--border-light)` }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: col?.dot || C.textMuted, flexShrink: 0 }} />
              <span style={{ color: C.textPrimary, fontWeight: 500 }}>{project?.name || 'Onbekend project'}</span>
            </div>
            <div className="checkin-actions">
              <button className="btn btn-primary" onClick={onContinue}>Ja, doorgaan</button>
              <button className="btn btn-secondary" onClick={onSwitchMode}>Switch project</button>
              <button className="btn btn-tertiary" onClick={onStop}>Stop timer</button>
            </div>
          </>
        )}
        {mode === 'switch' && (
          <>
            <div className="checkin-time">Switch project</div>
            <h3 className="checkin-question">Waar werk je nu aan?</h3>
            <div className="checkin-list">
              {projects.map((p, i) => {
                const c2 = getProjectColor(p, i);
                const isCurrent = p.id === projectId;
                return (
                  <button key={p.id} className={`checkin-list-item ${isCurrent ? 'current' : ''}`} onClick={() => onSwitch(p.id)}>
                    <span style={{ width: 8, height: 8, borderRadius: '50%', background: c2.dot, flexShrink: 0 }} />
                    <span style={{ flex: 1 }}>{p.name}</span>
                    {isCurrent && <span style={{ fontSize: '0.75rem', color: C.textTertiary }}>huidig</span>}
                  </button>
                );
              })}
            </div>
            <div className="checkin-actions">
              <button className="btn btn-tertiary" onClick={onCancelSwitch} style={{ color: C.textTertiary }}>← Terug</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// =========================================================
// WEEK COLUMNS — verticale dag-kolommen met balkje + uitklapbaar detail
// =========================================================
function WeekColumns({ projects, sessions, now }) {
  const [offset, setOffset]       = useState(0);
  const [expandedIdx, setExpanded] = useState(null); // index van uitgekapte dag (0-4)

  const todayKey = useMemo(() => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }, [now]);

  const weekDates = useMemo(() => {
    const monday = getMondayOf(offset);
    return Array.from({ length: 5 }, (_, i) => {
      const d = new Date(monday); d.setDate(monday.getDate() + i); return d;
    });
  }, [offset]);

  // Gebruik buildDayBlocks zodat session/todo-data beschikbaar is
  const days = useMemo(() => buildDayBlocks(weekDates, projects, sessions, now), [weekDates, projects, sessions, now]);

  const weekTotalFitted = days.reduce((s, d) => s + d.totalFitted, 0);
  const weekTotalMs     = days.reduce((s, d) => s + d.totalMs, 0);
  const dayNamesShort   = ['Ma', 'Di', 'Wo', 'Do', 'Vr'];
  const weekNum         = isoWeekNumber(weekDates[0]);
  const labelDates      = `${weekDates[0].getDate()} ${monthShort(weekDates[0].getMonth())} – ${weekDates[4].getDate()} ${monthShort(weekDates[4].getMonth())}`;
  const weekTag         = offset === 0 ? ' · deze week' : offset === -1 ? ' · vorige week' : offset === 1 ? ' · volgende week' : '';

  const toggleExpand = (idx) => setExpanded(prev => prev === idx ? null : idx);

  return (
    <div className="week-card">
      <div className="week-nav">
        <div className="week-label-area">
          <span className="week-label-num">Week {weekNum}{weekTag}</span>
          <span className="week-label-dates">{labelDates}</span>
        </div>
        <div className="week-arrows">
          <button className="week-arrow" onClick={() => { setOffset(o => o - 1); setExpanded(null); }} title="Vorige week"><ChevL size={14}/></button>
          <button className="week-arrow week-arrow-now" onClick={() => { setOffset(0); setExpanded(null); }} disabled={offset === 0} title="Deze week">Nu</button>
          <button className="week-arrow" onClick={() => { setOffset(o => o + 1); setExpanded(null); }} title="Volgende week"><ChevR size={14}/></button>
        </div>
      </div>

      <div className="week-grid">
        {days.map((day, idx) => {
          const isToday      = day.date.getTime() === todayKey;
          const hasData      = day.totalMs > 0;
          const hasRounded   = day.fitted.length > 0;
          const isExpanded   = expandedIdx === idx;
          const wrapHeightPx = 140;
          const dayScale     = Math.max(8, day.totalFitted);

          return (
            <div key={idx} className={`day-col ${isToday ? 'today' : ''}`}>
              <div className="day-header">
                <span className="day-name">{dayNamesShort[idx]}</span>
                <span className="day-date">{day.date.getDate()} {monthShort(day.date.getMonth())}</span>
              </div>

              <div className="day-bar-wrap">
                <span className="day-bar-guide" />
                {hasRounded ? (
                  <div className="day-bar">
                    {day.fitted.map(item => {
                      const proj = projects.find(p => p.id === item.id);
                      const projIdx = projects.findIndex(p => p.id === item.id);
                      const col = proj ? getProjectColor(proj, projIdx) : COLORS[0];
                      const segPx = (item.hoursFitted / dayScale) * wrapHeightPx;
                      if (segPx <= 0) return null;
                      return (
                        <div key={item.id} className="day-bar-segment"
                          style={{ height: `${segPx}px`, background: col.dot }}
                          title={`${item.name}: ${fmtHours(item.hoursFitted)}`} />
                      );
                    })}
                  </div>
                ) : (
                  <div className="day-bar-empty" />
                )}
              </div>

              <div className={`day-total ${!hasData ? 'zero' : ''}`}>
                {hasData ? fmtHours(day.totalFitted) : '—'}
              </div>
              {hasData && <div className="day-total-real" title="Werkelijk">{formatHMS(day.totalMs)}</div>}

              <div className="day-projects">
                {hasRounded ? day.fitted
                  .slice().sort((a, b) => b.hoursFitted - a.hoursFitted)
                  .map(item => {
                    const proj = projects.find(p => p.id === item.id);
                    const projIdx = projects.findIndex(p => p.id === item.id);
                    const col = proj ? getProjectColor(proj, projIdx) : COLORS[0];
                    return (
                      <div key={item.id} className="day-project-item">
                        <span className="ddot" style={{ background: col.dot }} />
                        <span className="pname">{item.name}</span>
                        <span className="phours">{fmtHours(item.hoursFitted)}</span>
                      </div>
                    );
                  }) : null}
              </div>

              {hasData && (
                <button className="day-expand-btn" onClick={() => toggleExpand(idx)} title={isExpanded ? 'Inklappen' : 'Uitklappen'}>
                  {isExpanded ? <ChevL size={12} style={{transform:'rotate(90deg)'}}/> : <ChevR size={12} style={{transform:'rotate(90deg)'}}/>}
                </button>
              )}
            </div>
          );
        })}

        {/* Uitklapbaar detailpaneel — volle breedte onder het grid */}
        {expandedIdx !== null && days[expandedIdx] && days[expandedIdx].totalMs > 0 && (
          <DayDetail
            day={days[expandedIdx]}
            projects={projects}
            dayName={`${dayNamesShort[expandedIdx]} ${days[expandedIdx].date.getDate()} ${monthShort(days[expandedIdx].date.getMonth())}`}
          />
        )}
      </div>

      <div className="week-total-row">
        <span className="week-total-label">Weektotaal</span>
        <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end'}}>
          <span className="week-total-value">{fmtHours(weekTotalFitted)}</span>
          <span className="week-total-real">{formatHMS(weekTotalMs)}</span>
        </div>
      </div>
    </div>
  );
}

// =========================================================
// DAGDETAIL — uitklapbaar paneel met 6-minuten breakdown
// =========================================================
function DayDetail({ day, projects, dayName }) {
  return (
    <div className="day-detail">
      <div className="day-detail-title">{dayName} — detail per 6 minuten</div>
      {day.byProject.map(proj => {
        const projObj = projects.find(p => p.id === proj.id);
        const projIdx = projects.findIndex(p => p.id === proj.id);
        const col = projObj ? getProjectColor(projObj, projIdx) : COLORS[0];

        return (
          <div key={proj.id} className="day-detail-proj">
            <div className="day-detail-proj-header">
              <span style={{width:8,height:8,borderRadius:'50%',background:col.dot,flexShrink:0,display:'inline-block'}}/>
              <span className="day-detail-proj-name">{proj.name}</span>
              <span className="day-detail-proj-blocks">{fmtBlocks(proj.ms)}</span>
              <span className="day-detail-proj-time">{fmtHours(proj.hoursFitted)}</span>
            </div>

            {proj.sessions.map(s => {
              const sd  = new Date(s.clippedStart);
              const ed  = new Date(s.clippedEnd);
              const dur = s.clippedEnd - s.clippedStart;
              const todos = s.todos || [];
              const hasTodos = todos.length > 0;

              return (
                <div key={s.id}>
                  <div className="day-detail-session">
                    <span className="day-detail-session-time">
                      {formatTimeShort(sd)}–{formatTimeShort(ed)}
                    </span>
                    <span className="day-detail-session-dur">
                      {fmtBlocks(dur)} ({formatHMS(dur)})
                    </span>
                  </div>
                  {hasTodos && (
                    <div className="day-detail-todos">
                      {todos.map(todo => (
                        <div key={todo.id} className="day-detail-todo">
                          <span className={`day-detail-todo-check ${todo.done ? 'done' : ''}`}/>
                          <span className={`day-detail-todo-text ${todo.done ? 'done' : ''}`}>{todo.text}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// =========================================================
// EXPORT MODAL — opent rapport in nieuw tabblad
// =========================================================
function ExportModal({ projects, sessions, now, onClose }) {
  const [period, setPeriod] = useState('week');

  const { dates, label } = useMemo(() => {
    if (period === 'today') {
      const t = new Date(); t.setHours(0,0,0,0);
      return { dates: [t], label: dayOfWeekNL(t) + ' ' + t.getDate() + ' ' + monthNL(t) + ' ' + t.getFullYear() };
    }
    const offset = period === 'week' ? 0 : -1;
    const monday = getMondayOf(offset);
    const ds = Array.from({ length: 5 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
    const wk = isoWeekNumber(monday);
    return { dates: ds, label: 'Week ' + wk + ' — ' + monday.getDate() + ' ' + monthNL(monday) + ' t/m ' + ds[4].getDate() + ' ' + monthNL(ds[4]) + ' ' + ds[4].getFullYear() };
  }, [period]);

  const dayBlocks = useMemo(() => buildDayBlocks(dates, projects, sessions, now), [dates, projects, sessions, now]);
  const totalFittedAll = dayBlocks.reduce((s, d) => s + d.totalFitted, 0);

  const summaryProjects = useMemo(() => {
    const map = new Map();
    dayBlocks.forEach(d => d.fitted.forEach(x => map.set(x.id, (map.get(x.id) || 0) + x.hoursFitted)));
    return projects.filter(p => map.has(p.id))
      .map(p => ({ ...p, total: map.get(p.id), _fi: projects.findIndex(x => x.id === p.id) }))
      .sort((a, b) => b.total - a.total);
  }, [dayBlocks, projects]);

  const openReport = () => {
    const win = window.open('', '_blank');
    if (!win) {
      alert('Pop-up geblokkeerd. Sta pop-ups toe voor deze pagina en probeer opnieuw.');
      return;
    }

    // Bouw de tabellen via DOM (geen complexe template literals)
    const doc = win.document;
    doc.open();
    doc.write('<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>Tijden — ' + escapeHTML(label) + '</title></head><body></body></html>');
    doc.close();

    // CSS — volledige breedte, met taken-lijst onder uren per cel
    const style = doc.createElement('style');
    style.textContent = [
      '*{box-sizing:border-box;margin:0;padding:0}',
      'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#f8f8f6;color:#1c1917;padding:32px;line-height:1.5}',
      '.header{margin-bottom:28px;max-width:1400px}',
      'h1{font-size:1.75rem;font-weight:600;letter-spacing:-0.02em;margin-bottom:4px}',
      '.meta{font-size:0.8rem;color:#78716c}',
      'table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e1ddd5;font-size:0.875rem;table-layout:fixed}',
      'th{background:#f0efea;font-weight:600;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:#78716c;padding:10px 14px;text-align:left;border-bottom:1px solid #e1ddd5;border-right:1px solid #e1ddd5;vertical-align:top}',
      'th:last-child{border-right:none}',
      'td{padding:12px 14px;border-bottom:1px solid #f0efea;border-right:1px solid #f0efea;color:#44403c;vertical-align:top;word-break:break-word}',
      'td:last-child{border-right:none}',
      'tr:last-child td{border-bottom:none}',
      '.day-cell{font-weight:500;color:#1c1917;width:160px}',
      '.hours{font-weight:600;color:#1c1917;font-variant-numeric:tabular-nums;font-size:0.95rem;display:block;margin-bottom:4px}',
      '.tasks{list-style:none;padding:0;margin:0}',
      '.tasks li{font-size:0.72rem;color:#78716c;line-height:1.45;padding-left:10px;position:relative;margin-bottom:2px}',
      '.tasks li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:#a8a29e}',
      '.empty-cell{color:#c9c4ba;font-size:0.85rem}',
      '.total-cell{font-weight:700;color:#b45309;font-variant-numeric:tabular-nums}',
      '.totaal-row td{background:#fafaf9;font-weight:600;border-top:2px solid #e1ddd5;color:#1c1917}',
      '.totaal-row .total-cell{color:#b45309;font-size:1.05rem}',
      '.print-btn{position:fixed;top:16px;right:16px;padding:8px 16px;border-radius:6px;border:1px solid #e1ddd5;background:#fff;cursor:pointer;font-size:0.8rem;color:#44403c;font-family:inherit;z-index:10}',
      '.print-btn:hover{background:#f0efea}',
      '@media print{body{padding:16px}.print-btn{display:none}td,th{padding:8px 10px}}',
    ].join('\n');
    doc.head.appendChild(style);

    const body = doc.body;

    // Print-knop
    const printBtn = doc.createElement('button');
    printBtn.className = 'print-btn';
    printBtn.textContent = 'Afdrukken / opslaan als PDF';
    printBtn.onclick = () => win.print();
    body.appendChild(printBtn);

    // Header
    const header = doc.createElement('div');
    header.className = 'header';
    const h1 = doc.createElement('h1');
    h1.textContent = 'Tijdregistratie';
    header.appendChild(h1);
    const meta = doc.createElement('p');
    meta.className = 'meta';
    meta.textContent = label + ' · gegenereerd op ' + new Date().toLocaleDateString('nl-NL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    header.appendChild(meta);
    body.appendChild(header);

    // Verzamel actieve projecten
    const activeProjIds = new Set();
    dayBlocks.forEach(d => d.fitted.forEach(x => activeProjIds.add(x.id)));
    const activeProjects = projects.filter(p => activeProjIds.has(p.id));

    // ── DE TABEL ──
    const table = doc.createElement('table');

    // Header: Dag | proj1 | proj2 | ... | Totaal
    const thead = doc.createElement('thead');
    const headRow = doc.createElement('tr');
    const addTh = (txt, cls) => {
      const th = doc.createElement('th');
      th.textContent = txt;
      if (cls) th.className = cls;
      headRow.appendChild(th);
    };
    addTh('Dag');
    activeProjects.forEach(p => addTh(p.name));
    addTh('Totaal');
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = doc.createElement('tbody');
    const projectTotals = {};
    activeProjects.forEach(p => { projectTotals[p.id] = 0; });

    // Helper: alle afgeronde taken voor één project op één dag
    const tasksFor = (day, projectId) => {
      const projData = day.byProject.find(bp => bp.id === projectId);
      if (!projData) return [];
      const out = [];
      projData.sessions.forEach(s => {
        (s.todos || []).filter(t => t.done).forEach(t => out.push(t.text));
      });
      return out;
    };

    dayBlocks.forEach(day => {
      const tr = doc.createElement('tr');

      // Dag-cel
      const dayTd = doc.createElement('td');
      dayTd.className = 'day-cell';
      dayTd.textContent = dayOfWeekNL(day.date) + ' ' + day.date.getDate() + ' ' + monthNL(day.date);
      tr.appendChild(dayTd);

      // Per project: uren bovenin, taken eronder
      activeProjects.forEach(p => {
        const td = doc.createElement('td');
        const item = day.fitted.find(x => x.id === p.id);
        const h = item ? item.hoursFitted : 0;
        projectTotals[p.id] += h;

        if (h > 0) {
          const hrSpan = doc.createElement('span');
          hrSpan.className = 'hours';
          hrSpan.textContent = fmtHours(h);
          td.appendChild(hrSpan);

          const tasks = tasksFor(day, p.id);
          if (tasks.length > 0) {
            const ul = doc.createElement('ul');
            ul.className = 'tasks';
            tasks.forEach(t => {
              const li = doc.createElement('li');
              li.textContent = t;
              ul.appendChild(li);
            });
            td.appendChild(ul);
          }
        } else {
          td.className = 'empty-cell';
          td.textContent = '—';
        }
        tr.appendChild(td);
      });

      // Totaal-cel
      const totalTd = doc.createElement('td');
      totalTd.className = 'total-cell';
      totalTd.textContent = day.totalFitted > 0 ? fmtHours(day.totalFitted) : '—';
      if (day.totalFitted === 0) totalTd.className = 'empty-cell';
      tr.appendChild(totalTd);

      tbody.appendChild(tr);
    });

    // Totaalregel
    const totaalTr = doc.createElement('tr');
    totaalTr.className = 'totaal-row';
    const totaalLabel = doc.createElement('td');
    totaalLabel.textContent = 'Totaal';
    totaalTr.appendChild(totaalLabel);
    activeProjects.forEach(p => {
      const td = doc.createElement('td');
      td.textContent = projectTotals[p.id] > 0 ? fmtHours(projectTotals[p.id]) : '';
      totaalTr.appendChild(td);
    });
    const grandTotalTd = doc.createElement('td');
    grandTotalTd.className = 'total-cell';
    grandTotalTd.textContent = fmtHours(totalFittedAll);
    totaalTr.appendChild(grandTotalTd);
    tbody.appendChild(totaalTr);

    table.appendChild(tbody);
    body.appendChild(table);

    onClose();
  };

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-dialog">
        <div className="modal-header">
          <h3 className="modal-title">Overzicht</h3>
          <button className="icon-btn" onClick={onClose}><Close size={16}/></button>
        </div>
        <p className="modal-subtitle">{label}</p>

        <div className="toggle-group" style={{marginBottom:20}}>
          <button className={`toggle-btn ${period==='today'    ? 'active':''}`} onClick={()=>setPeriod('today')}>Vandaag</button>
          <button className={`toggle-btn ${period==='week'     ? 'active':''}`} onClick={()=>setPeriod('week')}>Deze week</button>
          <button className={`toggle-btn ${period==='lastweek' ? 'active':''}`} onClick={()=>setPeriod('lastweek')}>Vorige week</button>
        </div>

        <div className="export-summary">
          {summaryProjects.length === 0
            ? <div className="export-summary-empty">Geen geregistreerde tijd voor deze periode.</div>
            : <>
                {summaryProjects.map(p => {
                  const col = getProjectColor(p, p._fi ?? 0);
                  return (
                    <div key={p.id} className="export-summary-row">
                      <span className="proj">
                        <span style={{width:7,height:7,borderRadius:'50%',background:col.dot,display:'inline-block',flexShrink:0}}/>
                        {p.name}
                      </span>
                      <span className="hrs">{fmtHours(p.total)}</span>
                    </div>
                  );
                })}
                <div className="export-summary-total">
                  <span className="lbl">Totaal</span>
                  <span className="val">{fmtHours(totalFittedAll)}</span>
                </div>
              </>
          }
        </div>

        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>Annuleer</button>
          <button className="btn btn-primary" onClick={openReport} disabled={summaryProjects.length === 0}>
            Open overzicht ↗
          </button>
        </div>
      </div>
    </div>
  );
}

// =========================================================
// PIP — uitgeklapt
// =========================================================
function PipExpanded({ activeSession, activeProject, activeColor, activeMs, projects, todayPerProject, totalTodayMs, onSwitch, onStop, onCollapse, onClose, onUpdateTodos }) {
  const c = activeColor || { dot: 'var(--text-disabled)', soft: 'transparent', ring: 'var(--border)' };
  return (
    <div style={{background:C.bg,color:C.textPrimary,minHeight:'100vh',padding:14,fontFamily:'"DM Sans",system-ui,sans-serif',boxSizing:'border-box'}}>
      <div style={{background: activeProject ? c.soft : C.surface, border:`1px solid ${activeProject ? c.ring : 'var(--border)'}`, borderRadius:12, padding:'12px 14px', marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <span style={{width:8,height:8,borderRadius:'50%',background:c.dot,boxShadow:activeProject?`0 0 8px ${c.ring}`:'none',flexShrink:0}}/>
          <span style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.1em',color:activeProject?C.textSecondary:C.textMuted,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {activeProject ? activeProject.name : 'Geen actieve timer'}
          </span>
          <button onClick={onCollapse} style={{background:'transparent',border:'none',color:C.textTertiary,cursor:'pointer',padding:4,borderRadius:4,display:'flex',alignItems:'center'}} title="Klap in"><Min size={13}/></button>
          {activeProject && <button onClick={onStop} style={{background:'transparent',border:'none',color:C.danger,cursor:'pointer',padding:4,borderRadius:4,display:'flex',alignItems:'center'}} title="Stop"><Square size={11} fill="currentColor"/></button>}
        </div>
        <div style={{fontFamily:'"Fraunces",serif',fontSize:'2.25rem',fontWeight:400,letterSpacing:'-0.02em',lineHeight:1,color:activeProject?C.textPrimary:C.textDisabled,fontVariantNumeric:'tabular-nums'}}>
          {formatTimer(activeMs)}
        </div>
      </div>
      {activeSession && (
        <PipTodoList
          todos={activeSession.todos || []}
          onChange={(todos) => onUpdateTodos(activeSession.id, todos)}
        />
      )}
      <div style={{display:'flex',flexDirection:'column',gap:2}}>
        {projects.map((p, i) => {
          const col = getProjectColor(p, i);
          const ms = todayPerProject.get(p.id) || 0;
          const isActive = activeProject && activeProject.id === p.id;
          return (
            <button key={p.id} onClick={() => onSwitch(p.id)}
              style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,
                background: isActive ? col.soft : 'transparent',
                border: isActive ? `1px solid ${col.ring}` : '1px solid transparent',
                color: isActive ? C.textPrimary : C.textSecondary,
                fontFamily:'inherit',fontSize:13,cursor:'pointer',textAlign:'left',width:'100%',transition:'background 0.15s'}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:col.dot,flexShrink:0}}/>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</span>
              <span style={{fontSize:11,color:ms > 0 ? C.textTertiary : C.textDisabled,fontVariantNumeric:'tabular-nums'}}>
                {ms > 0 ? formatHM(ms) : '—'}
              </span>
            </button>
          );
        })}
      </div>
      <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.borderLight}`,display:'flex',justifyContent:'space-between',fontSize:11,color:C.textTertiary}}>
        <span style={{textTransform:'uppercase',letterSpacing:'0.1em'}}>Vandaag</span>
        <span style={{fontFamily:'"Fraunces",serif',color:C.textPrimary,fontVariantNumeric:'tabular-nums'}}>
          {formatHM(totalTodayMs)}
        </span>
      </div>
    </div>
  );
}

// =========================================================
// PIP — ingeklapt (alleen pijl + dot)
// =========================================================
function PipCollapsed({ activeColor, onExpand }) {
  return (
    <button className="pip-collapsed" onClick={onExpand} title="Klap uit">
      {activeColor && <span className="pip-collapsed-dot" style={{ background: activeColor.dot, boxShadow: `0 0 6px ${activeColor.ring}`, animation: 'pulse 2s ease-in-out infinite' }} />}
      <ChevL size={20}/>
    </button>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
