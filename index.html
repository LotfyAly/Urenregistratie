const buildCastHtml = () => {
  const CAST_COLORS = "['#b45309','#047857','#be123c','#0369a1','#6d28d9','#4d7c0f','#0e7490','#c2410c','#b91c1c','#1d4ed8','#7c3aed','#0f766e']";
  return '<!DOCTYPE html>\n' +
  '<html lang="nl"><head><meta charset="UTF-8"/><title>Tijden \xb7 Cast</title>\n' +
  '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">\n' +
  '<style>\n' +
  '*{box-sizing:border-box;margin:0;padding:0}\n' +
  ':root{--bg:#f8f8f6;--surface:#fff;--border:#e1ddd5;--accent:#b45309;--text:#1c1917;--muted:#78716c;--dim:#c9c4ba}\n' +
  'body{background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}\n' +
  '.top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;gap:20px}\n' +
  '.project-name{font-size:1.5rem;font-weight:400;text-transform:uppercase;letter-spacing:0.2em;color:var(--muted);text-align:center;min-height:2rem}\n' +
  '.timer{font-family:"Fraunces",serif;font-size:clamp(5rem,18vw,14rem);font-weight:300;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--text);text-align:center}\n' +
  '.timer.idle{color:var(--dim)}\n' +
  '.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;flex-shrink:0}\n' +
  '.bottom{display:flex;align-items:stretch;border-top:1px solid var(--border);background:var(--surface)}\n' +
  '.day-total{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 32px;border-right:1px solid var(--border);gap:2px;min-width:140px}\n' +
  '.day-total-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--muted)}\n' +
  '.day-total-value{font-family:"Fraunces",serif;font-size:1.75rem;font-weight:400;font-variant-numeric:tabular-nums;color:var(--accent)}\n' +
  '.projects-row{flex:1;display:flex;align-items:stretch;overflow:hidden}\n' +
  '.proj-cell{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 20px;border-right:1px solid var(--border);min-width:0}\n' +
  '.proj-cell:last-child{border-right:none}\n' +
  '.proj-cell-name{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}\n' +
  '.proj-cell-time{font-family:"Fraunces",serif;font-size:1.3rem;font-weight:400;font-variant-numeric:tabular-nums;color:var(--text)}\n' +
  '.proj-cell.is-active{background:rgba(180,83,9,0.05)}\n' +
  '.proj-cell.is-active .proj-cell-time{color:var(--accent)}\n' +
  '.wall-clock{font-size:0.75rem;color:var(--muted);padding:10px 18px;position:fixed;top:12px;right:18px;font-variant-numeric:tabular-nums;letter-spacing:0.05em}\n' +
  '.no-data{color:var(--dim);font-size:0.9rem;margin:auto;padding:20px}\n' +
  '@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}\n' +
  '.dot.pulsing{animation:pulse 2s ease-in-out infinite}\n' +
  '</style></head><body>\n' +
  '<div class="wall-clock" id="wc"></div>\n' +
  '<div class="top">\n' +
  '  <div class="project-name" id="pn">Wacht op verbinding\u2026</div>\n' +
  '  <div class="timer idle" id="tm">00:00:00</div>\n' +
  '</div>\n' +
  '<div class="bottom">\n' +
  '  <div class="day-total"><div class="day-total-label">Vandaag</div><div class="day-total-value" id="dt">\u2014</div></div>\n' +
  '  <div class="projects-row" id="pr"><div class="no-data">Wacht op data\u2026</div></div>\n' +
  '</div>\n' +
  '<script>\n' +
  '(function(){\n' +
  '  var ch = new BroadcastChannel("tijden-cast");\n' +
  '  var state = null;\n' +
  '  var COLORS = ' + CAST_COLORS + ';\n' +
  '  function pad(n){return String(n).padStart(2,"0");}\n' +
  '  function fmtTimer(ms){var s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+":"+pad(Math.floor((s%3600)/60))+":"+pad(s%60);}\n' +
  '  function fmtH(ms){var h=Math.ceil(ms/1800000)*0.5;return h.toFixed(1).replace(".",",")+"\xa0u";}\n' +
  '  function projColor(p,fi){return p.colorHex||COLORS[fi%COLORS.length];}\n' +
  '  function render(){\n' +
  '    if(!state)return;\n' +
  '    var s=state,ap=s.activeProject,as=s.activeSession;\n' +
  '    var now=new Date();\n' +
  '    document.getElementById("wc").textContent=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());\n' +
  '    var activeMs=as?(Date.now()-as.startTime):0;\n' +
  '    var tm=document.getElementById("tm"),pn=document.getElementById("pn");\n' +
  '    if(ap){tm.textContent=fmtTimer(activeMs);tm.className="timer";pn.textContent=ap.name;}\n' +
  '    else{tm.textContent="00:00:00";tm.className="timer idle";pn.textContent="Geen actieve timer";}\n' +
  '    document.getElementById("dt").textContent=s.totalTodayMs>0?fmtH(s.totalTodayMs):"\u2014";\n' +
  '    var row=document.getElementById("pr");\n' +
  '    var active=s.projects.filter(function(p){return(s.todayPerProject[p.id]||0)>0;});\n' +
  '    if(active.length===0){row.innerHTML=\'<div class="no-data">Nog geen tijd vandaag</div>\';return;}\n' +
  '    row.innerHTML="";\n' +
  '    active.forEach(function(p){\n' +
  '      var fi=s.projects.findIndex(function(x){return x.id===p.id;});\n' +
  '      var ms=s.todayPerProject[p.id]||0;\n' +
  '      var isAct=ap&&ap.id===p.id;\n' +
  '      var col=projColor(p,fi);\n' +
  '      var cell=document.createElement("div");\n' +
  '      cell.className="proj-cell"+(isAct?" is-active":"");\n' +
  '      cell.innerHTML=\'<div class="proj-cell-name"><span class="dot\'+(isAct?\' pulsing\':\'\')+\'" style="background:\'+col+\'"></span>\'+p.name+\'</div>\'+\'<div class="proj-cell-time">\'+fmtH(ms)+\'</div>\';\n' +
  '      row.appendChild(cell);\n' +
  '    });\n' +
  '  }\n' +
  '  ch.onmessage=function(e){if(e.data&&e.data.type==="state"){state=e.data;render();}}\n' +
  '  setInterval(function(){if(state)render();},1000);\n' +
  '})();\n' +
  '<\/script>\n' +
  '</body></html>';
};

// =========================================================
// STALE TIMER BANNER
// =========================================================
function StaleBanner({ warning, onCorrect, onKeep }) {
  const h = Math.floor(warning.hoursRunning);
  const m = Math.round((warning.hoursRunning - h) * 60);
  const label = h > 0 ? `${h}u ${m}m` : `${m}m`;

  // Standaard correctietijd: eindtijd van gisteren 18:00
  const defaultEnd = () => {
    const d = new Date();
    d.setHours(18, 0, 0, 0);
    // Als de sessie gisteren startte, zet eindtijd op gisteren 18:00
    if (d.getTime() > Date.now()) d.setDate(d.getDate() - 1);
    return d.getTime();
  };
  const [endTs, setEndTs] = useState(defaultEnd);

  const timeVal = () => {
    const d = new Date(endTs);
    return d.toISOString().slice(0, 16); // yyyy-mm-ddTHH:MM
  };

  return (
    <div className="stale-banner">
      <span className="stale-banner-icon">⚠️</span>
      <div className="stale-banner-text">
        <strong>{warning.projectName}</strong> loopt al {label}. Vergeten te stoppen?
        <div style={{marginTop:6,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <span style={{fontSize:'0.75rem',color:'#92400e'}}>Eindtijd:</span>
          <input
            type="datetime-local"
            value={timeVal()}
            onChange={e => setEndTs(new Date(e.target.value).getTime())}
            style={{padding:'3px 7px',borderRadius:5,border:'1px solid #fcd34d',background:'#fffbeb',color:'#78350f',fontSize:'0.8rem',fontFamily:'inherit'}}
          />
        </div>
      </div>
      <div className="stale-banner-actions">
        <button className="stale-btn stale-btn-primary" onClick={() => onCorrect(endTs)}>Corrigeer</button>
        <button className="stale-btn stale-btn-secondary" onClick={onKeep}>Klopt zo</button>
      </div>
    </div>
  );
}

// =========================================================
// HANDMATIGE TIJDINVOER
// =========================================================
function ManualTimeForm({ projects, onAdd }) {
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const [projectId, setProjectId] = useState(projects[0]?.id || '');
  const [date, setDate]           = useState(todayStr);
  const [startTime, setStart]     = useState('09:00');
  const [endTime, setEnd]         = useState('10:00');
  const [error, setError]         = useState('');

  const handle = async () => {
    if (!projectId) { setError('Kies een project.'); return; }
    const startTs = new Date(`${date}T${startTime}`).getTime();
    const endTs   = new Date(`${date}T${endTime}`).getTime();
    if (isNaN(startTs) || isNaN(endTs)) { setError('Ongeldige datum of tijd.'); return; }
    if (endTs <= startTs) { setError('Eindtijd moet na begintijd liggen.'); return; }
    if (endTs > Date.now() + 60000) { setError('Eindtijd mag niet in de toekomst liggen.'); return; }
    setError('');
    await onAdd(projectId, startTs, endTs);
  };

  return (
    <div className="manual-form">
      <div className="manual-form-title">Tijd handmatig toevoegen</div>
      <div className="manual-form-row">
        <div className="manual-field">
          <label>Project</label>
          <select value={projectId} onChange={e => setProjectId(e.target.value)}>
            {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div className="manual-field">
          <label>Datum</label>
          <input type="date" value={date} max={todayStr()} onChange={e => setDate(e.target.value)} />
        </div>
        <div className="manual-field">
          <label>Begintijd</label>
          <input type="time" value={startTime} onChange={e => setStart(e.target.value)} />
        </div>
        <div className="manual-field">
          <label>Eindtijd</label>
          <input type="time" value={endTime} onChange={e => setEnd(e.target.value)} />
        </div>
        <button className="manual-add-btn" onClick={handle}>Toevoegen</button>
      </div>
      {error && <div style={{fontSize:'0.75rem',color:'var(--danger)',marginTop:8}}>{error}</div>}
    </div>
  );
}

function CheckInDialog({ time, projectId, projects, mode, onContinue, onSwitchMode, onSwitch, onStop, onCancelSwitch }) {
  const project = projects.find(p => p.id === projectId);

  const col = project ? getProjectColor(project, projIdx) : null;

  return (
    <div className="checkin-overlay" onClick={(e) => { if (e.target === e.currentTarget) onContinue(); }}>
      <div className="checkin-dialog">
        {mode === 'ask' && (
          <>
            <div className="checkin-time">Check-in · {formatTimeShort(time)}</div>
            <h3 className="checkin-question">Ben je nog bezig met dit project?</h3>
            <div className="checkin-active" style={{ background: col?.soft || C.surfaceSunken, border: col ? `1px solid ${col.ring}` : `1px solid var(--border-light)` }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: col?.dot || C.textMuted, flexShrink: 0 }} />
              <span style={{ color: C.textPrimary, fontWeight: 500 }}>{project?.name || 'Onbekend project'}</span>
            </div>
            <div className="checkin-actions">
              <button className="btn btn-primary" onClick={onContinue}>Ja, doorgaan</button>
              <button className="btn btn-secondary" onClick={onSwitchMode}>Switch project</button>
              <button className="btn btn-tertiary" onClick={onStop}>Stop timer</button>
            </div>
          </>
        )}
        {mode === 'switch' && (
          <>
            <div className="checkin-time">Switch project</div>
            <h3 className="checkin-question">Waar werk je nu aan?</h3>
            <div className="checkin-list">
              {projects.map((p, i) => {
                const c2 = getProjectColor(p, i);
                const isCurrent = p.id === projectId;
                return (
                  <button key={p.id} className={`checkin-list-item ${isCurrent ? 'current' : ''}`} onClick={() => onSwitch(p.id)}>
                    <span style={{ width: 8, height: 8, borderRadius: '50%', background: c2.dot, flexShrink: 0 }} />
                    <span style={{ flex: 1 }}>{p.name}</span>
                    {isCurrent && <span style={{ fontSize: '0.75rem', color: C.textTertiary }}>huidig</span>}
                  </button>
                );
              })}
            </div>
            <div className="checkin-actions">
              <button className="btn btn-tertiary" onClick={onCancelSwitch} style={{ color: C.textTertiary }}>← Terug</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// =========================================================
// WEEK COLUMNS — verticale dag-kolommen met balkje + uitklapbaar detail
// =========================================================
function WeekColumns({ projects, sessions, now, workClip = null, overrides = {}, activeSessionId = null, onUpdateSession, onDeleteSession, onSetProjectOverride, onClearDayOverrides }) {
  const [offset, setOffset]       = useState(0);
  const [expandedIdx, setExpanded] = useState(null); // index van uitgekapte dag (0-4)
  const [editDayIdx, setEditDayIdx] = useState(null); // index van dag waarvoor uren-dialog open is

  const todayKey = useMemo(() => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }, [now]);

  const weekDates = useMemo(() => {
    const monday = getMondayOf(offset);
    return Array.from({ length: 5 }, (_, i) => {
      const d = new Date(monday); d.setDate(monday.getDate() + i); return d;
    });
  }, [offset]);

  // Gebruik buildDayBlocks zodat session/todo-data beschikbaar is
  const days = useMemo(
    () => buildDayBlocks(weekDates, projects, sessions, now, workClip, overrides),
    [weekDates, projects, sessions, now, workClip, overrides]
  );

  const weekTotalFitted = days.reduce((s, d) => s + d.totalFitted, 0);
  const weekTotalMs     = days.reduce((s, d) => s + d.totalMs, 0);
  const dayNamesShort   = ['Ma', 'Di', 'Wo', 'Do', 'Vr'];
  const weekNum         = isoWeekNumber(weekDates[0]);
  const labelDates      = `${weekDates[0].getDate()} ${monthShort(weekDates[0].getMonth())} – ${weekDates[4].getDate()} ${monthShort(weekDates[4].getMonth())}`;
  const weekTag         = offset === 0 ? ' · deze week' : offset === -1 ? ' · vorige week' : offset === 1 ? ' · volgende week' : '';

  const toggleExpand = (idx) => setExpanded(prev => prev === idx ? null : idx);

  return (
    <div className="week-card">
      <div className="week-nav">
        <div className="week-label-area">
          <span className="week-label-num">Week {weekNum}{weekTag}</span>
          <span className="week-label-dates">{labelDates}</span>
        </div>
        <div className="week-arrows">
          <button className="week-arrow" onClick={() => { setOffset(o => o - 1); setExpanded(null); setEditDayIdx(null); }} title="Vorige week"><ChevL size={14}/></button>
          <button className="week-arrow week-arrow-now" onClick={() => { setOffset(0); setExpanded(null); setEditDayIdx(null); }} disabled={offset === 0} title="Deze week">Nu</button>
          <button className="week-arrow" onClick={() => { setOffset(o => o + 1); setExpanded(null); setEditDayIdx(null); }} title="Volgende week"><ChevR size={14}/></button>
        </div>
      </div>

      <div className="week-grid">
        {days.map((day, idx) => {
          const isToday      = day.date.getTime() === todayKey;
          const hasData      = day.totalMs > 0 || (day.fitted.length > 0);
          const hasRounded   = day.fitted.length > 0;
          const isExpanded   = expandedIdx === idx;
          const wrapHeightPx = 140;
          const dayScale     = Math.max(8, day.totalFitted);
          const dayHasOverrides = !!(overrides[day.dateKey] && Object.keys(overrides[day.dateKey]).length > 0);
          const totalIsOverride = day.fitted.some(x => x.isOverride);

          return (
            <div key={idx} className={`day-col ${isToday ? 'today' : ''} ${dayHasOverrides ? 'has-overrides' : ''}`}>
              <button
                className="day-edit-btn"
                onClick={() => setEditDayIdx(idx)}
                title="Uren bewerken"
              >
                <Pencil size={11}/>
              </button>

              <div className="day-header">
                <span className="day-name">{dayNamesShort[idx]}</span>
                <span className="day-date">{day.date.getDate()} {monthShort(day.date.getMonth())}</span>
              </div>

              <div className="day-bar-wrap">
                <span className="day-bar-guide" />
                {hasRounded ? (
                  <div className="day-bar">
                    {day.fitted.map(item => {
                      const proj = projects.find(p => p.id === item.id);
                      const projIdx = projects.findIndex(p => p.id === item.id);
                      const col = proj ? getProjectColor(proj, projIdx) : COLORS[0];
                      const segPx = (item.hoursFitted / dayScale) * wrapHeightPx;
                      if (segPx <= 0) return null;
                      return (
                        <div key={item.id} className="day-bar-segment"
                          style={{ height: `${segPx}px`, background: col.dot, opacity: item.isOverride ? 0.85 : 1 }}
                          title={`${item.name}: ${fmtHours(item.hoursFitted)}${item.isOverride ? ' (handmatig)' : ''}`} />
                      );
                    })}
                  </div>
                ) : (
                  <div className="day-bar-empty" />
                )}
              </div>

              <div className={`day-total ${!hasData ? 'zero' : ''}`}>
                {hasData ? (
                  <button
                    className={`day-total-clickable ${totalIsOverride ? 'is-override' : ''}`}
                    onClick={() => setEditDayIdx(idx)}
                    title="Uren bewerken"
                  >
                    {fmtHours(day.totalFitted)}
                  </button>
                ) : (
                  <button
                    className="day-total-clickable"
                    onClick={() => setEditDayIdx(idx)}
                    title="Uren bewerken"
                    style={{color:'var(--text-disabled)'}}
                  >—</button>
                )}
              </div>
              {day.totalMs > 0 && <div className="day-total-real" title="Werkelijk geregistreerd">{formatHMS(day.totalMs)}</div>}

              <div className="day-projects">
                {hasRounded ? day.fitted
                  .slice().sort((a, b) => b.hoursFitted - a.hoursFitted)
                  .map(item => {
                    const proj = projects.find(p => p.id === item.id);
                    const projIdx = projects.findIndex(p => p.id === item.id);
                    const col = proj ? getProjectColor(proj, projIdx) : COLORS[0];
                    return (
                      <div key={item.id} className="day-project-item">
                        <span className="ddot" style={{ background: col.dot }} />
                        <span className="pname">{item.name}</span>
                        <button
                          className={`phours-clickable ${item.isOverride ? 'is-override' : ''}`}
                          onClick={() => setEditDayIdx(idx)}
                          title={item.isOverride ? `Handmatig (berekend: ${fmtHours(item.naturalHours)})` : 'Uren bewerken'}
                        >
                          {fmtHours(item.hoursFitted)}
                        </button>
                      </div>
                    );
                  }) : null}
              </div>

              {day.totalMs > 0 && (
                <button className="day-expand-btn" onClick={() => toggleExpand(idx)} title={isExpanded ? 'Inklappen' : 'Uitklappen'}>
                  {isExpanded ? <ChevL size={12} style={{transform:'rotate(90deg)'}}/> : <ChevR size={12} style={{transform:'rotate(90deg)'}}/>}
                </button>
              )}
            </div>
          );
        })}

        {/* Uitklapbaar detailpaneel — volle breedte onder het grid */}
        {expandedIdx !== null && days[expandedIdx] && days[expandedIdx].totalMs > 0 && (
          <DayDetail
            day={days[expandedIdx]}
            projects={projects}
            dayName={`${dayNamesShort[expandedIdx]} ${days[expandedIdx].date.getDate()} ${monthShort(days[expandedIdx].date.getMonth())}`}
            activeSessionId={activeSessionId}
            onUpdateSession={onUpdateSession}
            onDeleteSession={onDeleteSession}
          />
        )}
      </div>

      {editDayIdx !== null && days[editDayIdx] && (
        <DayHoursDialog
          day={days[editDayIdx]}
          projects={projects}
          dayLabel={`${dayNamesShort[editDayIdx]} ${days[editDayIdx].date.getDate()} ${monthShort(days[editDayIdx].date.getMonth())}`}
          overrides={overrides[days[editDayIdx].dateKey] || {}}
          onSetOverride={(projectId, hours) => onSetProjectOverride(days[editDayIdx].dateKey, projectId, hours)}
          onClearAll={() => onClearDayOverrides(days[editDayIdx].dateKey)}
          onClose={() => setEditDayIdx(null)}
        />
      )}

      <div className="week-total-row">
        <span className="week-total-label">Weektotaal</span>
        <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end'}}>
          <span className="week-total-value">{fmtHours(weekTotalFitted)}</span>
          <span className="week-total-real">{formatHMS(weekTotalMs)}</span>
        </div>
      </div>
    </div>
  );
}

// =========================================================
// DAG-UREN DIALOG — handmatig uren overschrijven per project per dag
// =========================================================
function DayHoursDialog({ day, projects, dayLabel, overrides, onSetOverride, onClearAll, onClose }) {
  // Bouw één rij per project: alle bestaande projecten zichtbaar (ook zonder uren),
  // zodat je kunt toevoegen aan een dag waar het project nog niet op stond.
  // Lokale state voor inputvelden — pas opslaan bij blur.
  // Belangrijk: lazy initializer (geen useEffect-reset) — voorkomt dat input gereset wordt
  // tijdens typen wanneer de parent rerendert (bv. door 'now'-tick elke seconde).
  const formatVal = (n) => (n == null || !isFinite(n) || Number(n) <= 0) ? '' : String(n).replace('.', ',');

  const [vals, setVals] = useState(() => {
    const m = {};
    projects.forEach(p => {
      const fittedItem = day.fitted.find(x => x.id === p.id);
      const overrideVal = Object.prototype.hasOwnProperty.call(overrides, p.id) ? overrides[p.id] : null;
      const val = overrideVal != null ? overrideVal : (fittedItem ? fittedItem.hoursFitted : 0);
      m[p.id] = formatVal(val);
    });
    return m;
  });

  const parseInput = (str) => {
    if (str == null || str === '') return null;
    const trimmed = String(str).trim().replace(',', '.');
    if (!/^\d*\.?\d+$/.test(trimmed)) return null;
    const n = Number(trimmed);
    if (!isFinite(n) || n <= 0) return null;
    return Math.round(n * 100) / 100; // 2 decimalen max
  };

  const computeTotal = () => {
    let t = 0;
    Object.values(vals).forEach(v => { const n = parseInput(v); if (n != null) t += n; });
    return t;
  };

  const handleChange = (projectId, str) => {
    setVals(prev => ({ ...prev, [projectId]: str }));
  };

  // Bij blur: valideer, sla op of wis override, en synchroniseer altijd het inputveld
  // zodat de UI nooit een ongeldige of stale waarde toont.
  const handleBlur = (projectId) => {
    const item = day.fitted.find(x => x.id === projectId);
    const naturalHours = item ? (item.isOverride ? item.naturalHours : item.hoursFitted) : 0;
    const newVal = parseInput(vals[projectId]);
    const wasOverride = Object.prototype.hasOwnProperty.call(overrides, projectId);

    if (newVal == null) {
      // Leeg, 0, of ongeldig: wis override en zet input terug op berekende waarde
      if (wasOverride) onSetOverride(projectId, null);
      setVals(prev => ({ ...prev, [projectId]: formatVal(naturalHours) }));
      return;
    }
    if (!wasOverride && Math.abs(newVal - naturalHours) < 0.001) {
      // Identieke waarde → niets opslaan; normaliseer wel input voor cleanup
      setVals(prev => ({ ...prev, [projectId]: formatVal(naturalHours) }));
      return;
    }
    onSetOverride(projectId, newVal);
    setVals(prev => ({ ...prev, [projectId]: formatVal(newVal) }));
  };

  const handleReset = (projectId) => {
    if (Object.prototype.hasOwnProperty.call(overrides, projectId)) {
      onSetOverride(projectId, null);
    }
    const item = day.fitted.find(x => x.id === projectId);
    const naturalHours = item ? (item.isOverride ? item.naturalHours : item.hoursFitted) : 0;
    setVals(prev => ({ ...prev, [projectId]: formatVal(naturalHours) }));
  };

  const hasAnyOverride = Object.keys(overrides).length > 0;
  const totalNow = computeTotal();

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="dh-dialog">
        <div className="dh-header">
          <div>
            <h3 className="dh-title">Uren bewerken</h3>
            <p className="dh-sub">{dayLabel}</p>
          </div>
          <button className="icon-btn" onClick={onClose} aria-label="Sluit"><Close size={16}/></button>
        </div>

        <div className="dh-info">
          Pas hier de uren per project aan. Een handmatige waarde overschrijft het berekende totaal uit de sessies.
          De originele sessies blijven bewaard — de reset-knop (↺) zet een regel terug.
        </div>

        <div className="dh-list">
          {projects.map((p, i) => {
            const col = getProjectColor(p, i);
            const item = day.fitted.find(x => x.id === p.id);
            const isOverride = Object.prototype.hasOwnProperty.call(overrides, p.id);
            const naturalHours = item ? (item.isOverride ? item.naturalHours : item.hoursFitted) : 0;
            return (
              <div key={p.id} className={`dh-row ${isOverride ? 'is-override' : ''}`}>
                <span className="dh-dot" style={{ background: col.dot }}/>
                <div className="dh-natural-line">
                  <span className="dh-name">{p.name}</span>
                  {naturalHours > 0 && (
                    <span className="dh-natural">
                      Berekend: {fmtHours(naturalHours)}
                      {isOverride && ' · handmatig actief'}
                    </span>
                  )}
                  {naturalHours === 0 && isOverride && (
                    <span className="dh-natural">Handmatig toegevoegd</span>
                  )}
                </div>
                <div className="dh-input-wrap">
                  <input
                    type="text"
                    inputMode="decimal"
                    pattern="[0-9.,]*"
                    placeholder="0"
                    value={vals[p.id] || ''}
                    onChange={e => handleChange(p.id, e.target.value)}
                    onBlur={() => handleBlur(p.id)}
                    onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { e.target.blur(); } }}
                  />
                  <span className="dh-unit">u</span>
                </div>
                <button
                  className="dh-reset"
                  onClick={() => handleReset(p.id)}
                  disabled={!isOverride}
                  title={isOverride ? 'Reset naar berekende waarde' : 'Geen override'}
                >
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
                  </svg>
                </button>
              </div>
            );
          })}
        </div>

        <div className="dh-totals">
          <span className="dh-total-label">Totaal vandaag</span>
          <span className="dh-total-value">{fmtHours(totalNow)}</span>
        </div>

        <div className="dh-actions">
          <button
            className="dh-clear-all"
            onClick={() => { onClearAll(); onClose(); }}
            disabled={!hasAnyOverride}
            title={hasAnyOverride ? 'Verwijder alle handmatige aanpassingen voor deze dag' : 'Geen handmatige aanpassingen'}
          >
            Reset alle aanpassingen voor deze dag
          </button>
          <button className="btn btn-primary" onClick={onClose}>Klaar</button>
        </div>
      </div>
    </div>
  );
}

// =========================================================
// DAGDETAIL — uitklapbaar paneel met 6-minuten breakdown
// =========================================================
function DayDetail({ day, projects, dayName, activeSessionId, onUpdateSession, onDeleteSession }) {
  const [editingId, setEditingId] = useState(null);

  return (
    <div className="day-detail">
      <div className="day-detail-title">{dayName} — detail per 6 minuten</div>
      {day.byProject.map(proj => {
        const projObj = projects.find(p => p.id === proj.id);
        const projIdx = projects.findIndex(p => p.id === proj.id);
        const col = projObj ? getProjectColor(projObj, projIdx) : COLORS[0];

        return (
          <div key={proj.id} className="day-detail-proj">
            <div className="day-detail-proj-header">
              <span style={{width:8,height:8,borderRadius:'50%',background:col.dot,flexShrink:0,display:'inline-block'}}/>
              <span className="day-detail-proj-name">
                {proj.name}
                {proj.isOverride && (
                  <span title={`Handmatig ingesteld op ${fmtHours(proj.hoursFitted)} (berekend: ${fmtHours(proj.naturalHours)})`} style={{marginLeft:6,fontSize:'0.65rem',textTransform:'uppercase',letterSpacing:'0.1em',color:'var(--accent)',fontWeight:500}}>
                    handmatig
                  </span>
                )}
              </span>
              <span className="day-detail-proj-blocks">{fmtBlocks(proj.ms)}</span>
              <span className="day-detail-proj-time">{fmtHours(proj.hoursFitted)}</span>
            </div>

            {proj.sessions.map(s => {
              const sd  = new Date(s.clippedStart);
              const ed  = new Date(s.clippedEnd);
              const dur = s.clippedEnd - s.clippedStart;
              const todos = s.todos || [];
              const hasTodos = todos.length > 0;
              const isActive = activeSessionId && s.id === activeSessionId;
              const isEditing = editingId === s.id;
              // Toon werkelijke (ongeclipte) starttijd als hint dat de sessie geclipt is
              const realStart = s.startTime;
              const realEnd   = s.endTime ?? Date.now();
              const isClipped = realStart < s.clippedStart || realEnd > s.clippedEnd;

              return (
                <div key={s.id} className="session-row-wrap">
                  {isEditing ? (
                    <SessionEditForm
                      session={s}
                      onSave={async (newStart, newEnd) => {
                        const ok = await onUpdateSession(s.id, newStart, newEnd);
                        if (ok) setEditingId(null);
                        return ok;
                      }}
                      onCancel={() => setEditingId(null)}
                    />
                  ) : (
                    <div className="day-detail-session">
                      <span className="day-detail-session-time">
                        {formatTimeShort(sd)}–{formatTimeShort(ed)}
                      </span>
                      <span className="day-detail-session-dur">
                        {fmtBlocks(dur)} ({formatHMS(dur)})
                      </span>
                      {isClipped && !isActive && (
                        <span title="Sessie loopt buiten werkuren — wordt afgeknipt" style={{fontSize:'0.65rem',color:'var(--text-muted)',marginLeft:4}}>✂</span>
                      )}
                      {isActive && <span className="session-active-badge">loopt nu</span>}
                      <span className="session-actions">
                        {!isActive && (
                          <>
                            <button className="session-action-btn" title="Bewerk tijden" onClick={() => setEditingId(s.id)}>
                              <Pencil size={11}/>
                            </button>
                            <button className="session-action-btn danger" title="Verwijder sessie" onClick={() => onDeleteSession(s.id)}>
                              <Trash2 size={11}/>
                            </button>
                          </>
                        )}
                      </span>
                    </div>
                  )}
                  {hasTodos && !isEditing && (
                    <div className="day-detail-todos">
                      {todos.map(todo => (
                        <div key={todo.id} className="day-detail-todo">
                          <span className={`day-detail-todo-check ${todo.done ? 'done' : ''}`}/>
                          <span className={`day-detail-todo-text ${todo.done ? 'done' : ''}`}>{todo.text}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// =========================================================
// SESSIE BEWERKEN — inline form in DayDetail
// =========================================================
function SessionEditForm({ session, onSave, onCancel }) {
  // Werk met de WERKELIJKE (ongeclipte) starttijd & eindtijd
  const initStart = new Date(session.startTime);
  const initEnd   = new Date(session.endTime ?? Date.now());

  const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const toTimeStr = (d) => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

  const [date, setDate]       = useState(toDateStr(initStart));
  const [startStr, setStart]  = useState(toTimeStr(initStart));
  const [endStr, setEnd]      = useState(toTimeStr(initEnd));
  const [error, setError]     = useState('');

  // Waarschuw als sessie meerdere kalenderdagen omspant
  const isMultiDay = toDateStr(initStart) !== toDateStr(initEnd);

  const handleSave = async () => {
    const newStart = new Date(`${date}T${startStr}`).getTime();
    const newEnd   = new Date(`${date}T${endStr}`).getTime();
    if (isNaN(newStart) || isNaN(newEnd)) { setError('Ongeldige datum of tijd.'); return; }
    if (newEnd <= newStart) { setError('Eindtijd moet na begintijd liggen.'); return; }
    if (newEnd > Date.now() + 60000) { setError('Eindtijd mag niet in de toekomst liggen.'); return; }
    setError('');
    const ok = await onSave(newStart, newEnd);
    if (!ok) setError('Opslaan mislukt.');
  };

  return (
    <div className="session-edit-form">
      <span className="field-label">Datum</span>
      <input type="date" value={date} onChange={e => setDate(e.target.value)} />
      <span className="field-label">Van</span>
      <input type="time" value={startStr} onChange={e => setStart(e.target.value)} />
      <span className="field-label">tot</span>
      <input type="time" value={endStr} onChange={e => setEnd(e.target.value)} />
      <div className="form-actions">
        <button className="cancel-btn" onClick={onCancel}>Annuleer</button>
        <button className="save-btn" onClick={handleSave}>Opslaan</button>
      </div>
      {isMultiDay && !error && (
        <div className="session-edit-error" style={{color:'var(--text-tertiary)'}}>
          Let op: deze sessie liep oorspronkelijk over meerdere dagen. Aanpassing zet hem op één dag.
        </div>
      )}
      {error && <div className="session-edit-error">{error}</div>}
    </div>
  );
}

// =========================================================
// EXPORT MODAL — opent rapport in nieuw tabblad
// =========================================================
function ExportModal({ projects, sessions, now, workClip = null, overrides = {}, onClose }) {
  const [period, setPeriod] = useState('week');

  const { dates, label } = useMemo(() => {
    if (period === 'today') {
      const t = new Date(); t.setHours(0,0,0,0);
      return { dates: [t], label: dayOfWeekNL(t) + ' ' + t.getDate() + ' ' + monthNL(t) + ' ' + t.getFullYear() };
    }
    const offset = period === 'week' ? 0 : -1;
    const monday = getMondayOf(offset);
    const ds = Array.from({ length: 5 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
    const wk = isoWeekNumber(monday);
    return { dates: ds, label: 'Week ' + wk + ' — ' + monday.getDate() + ' ' + monthNL(monday) + ' t/m ' + ds[4].getDate() + ' ' + monthNL(ds[4]) + ' ' + ds[4].getFullYear() };
  }, [period]);

  const dayBlocks = useMemo(
    () => buildDayBlocks(dates, projects, sessions, now, workClip, overrides),
    [dates, projects, sessions, now, workClip, overrides]
  );
  const totalFittedAll = dayBlocks.reduce((s, d) => s + d.totalFitted, 0);

  const summaryProjects = useMemo(() => {
    const map = new Map();
    dayBlocks.forEach(d => d.fitted.forEach(x => map.set(x.id, (map.get(x.id) || 0) + x.hoursFitted)));
    return projects.filter(p => map.has(p.id))
      .map(p => ({ ...p, total: map.get(p.id), _fi: projects.findIndex(x => x.id === p.id) }))
      .sort((a, b) => b.total - a.total);
  }, [dayBlocks, projects]);

  const openReport = () => {
    const win = window.open('', '_blank');
    if (!win) {
      alert('Pop-up geblokkeerd. Sta pop-ups toe voor deze pagina en probeer opnieuw.');
      return;
    }

    // Bouw de tabellen via DOM (geen complexe template literals)
    const doc = win.document;
    doc.open();
    doc.write('<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>Tijden — ' + escapeHTML(label) + '</title></head><body></body></html>');
    doc.close();

    // CSS — volledige breedte, met taken-lijst onder uren per cel
    const style = doc.createElement('style');
    style.textContent = [
      '*{box-sizing:border-box;margin:0;padding:0}',
      'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#f8f8f6;color:#1c1917;padding:32px;line-height:1.5}',
      '.header{margin-bottom:28px;max-width:1400px}',
      'h1{font-size:1.75rem;font-weight:600;letter-spacing:-0.02em;margin-bottom:4px}',
      '.meta{font-size:0.8rem;color:#78716c}',
      'table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e1ddd5;font-size:0.875rem;table-layout:fixed}',
      'th{background:#f0efea;font-weight:600;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:#78716c;padding:10px 14px;text-align:left;border-bottom:1px solid #e1ddd5;border-right:1px solid #e1ddd5;vertical-align:top}',
      'th:last-child{border-right:none}',
      'td{padding:12px 14px;border-bottom:1px solid #f0efea;border-right:1px solid #f0efea;color:#44403c;vertical-align:top;word-break:break-word}',
      'td:last-child{border-right:none}',
      'tr:last-child td{border-bottom:none}',
      '.day-cell{font-weight:500;color:#1c1917;width:160px}',
      '.hours{font-weight:600;color:#1c1917;font-variant-numeric:tabular-nums;font-size:0.95rem;display:block;margin-bottom:4px}',
      '.tasks{list-style:none;padding:0;margin:0}',
      '.tasks li{font-size:0.72rem;color:#78716c;line-height:1.45;padding-left:10px;position:relative;margin-bottom:2px}',
      '.tasks li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:#a8a29e}',
      '.empty-cell{color:#c9c4ba;font-size:0.85rem}',
      '.total-cell{font-weight:700;color:#b45309;font-variant-numeric:tabular-nums}',
      '.totaal-row td{background:#fafaf9;font-weight:600;border-top:2px solid #e1ddd5;color:#1c1917}',
      '.totaal-row .total-cell{color:#b45309;font-size:1.05rem}',
      '.print-btn{position:fixed;top:16px;right:16px;padding:8px 16px;border-radius:6px;border:1px solid #e1ddd5;background:#fff;cursor:pointer;font-size:0.8rem;color:#44403c;font-family:inherit;z-index:10}',
      '.print-btn:hover{background:#f0efea}',
      '@media print{body{padding:16px}.print-btn{display:none}td,th{padding:8px 10px}}',
    ].join('\n');
    doc.head.appendChild(style);

    const body = doc.body;

    // Print-knop
    const printBtn = doc.createElement('button');
    printBtn.className = 'print-btn';
    printBtn.textContent = 'Afdrukken / opslaan als PDF';
    printBtn.onclick = () => win.print();
    body.appendChild(printBtn);

    // Header
    const header = doc.createElement('div');
    header.className = 'header';
    const h1 = doc.createElement('h1');
    h1.textContent = 'Tijdregistratie';
    header.appendChild(h1);
    const meta = doc.createElement('p');
    meta.className = 'meta';
    meta.textContent = label + ' · gegenereerd op ' + new Date().toLocaleDateString('nl-NL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    header.appendChild(meta);
    body.appendChild(header);

    // Verzamel actieve projecten
    const activeProjIds = new Set();
    dayBlocks.forEach(d => d.fitted.forEach(x => activeProjIds.add(x.id)));
    const activeProjects = projects.filter(p => activeProjIds.has(p.id));

    // ── DE TABEL ──
    const table = doc.createElement('table');

    // Header: Dag | proj1 | proj2 | ... | Totaal
    const thead = doc.createElement('thead');
    const headRow = doc.createElement('tr');
    const addTh = (txt, cls) => {
      const th = doc.createElement('th');
      th.textContent = txt;
      if (cls) th.className = cls;
      headRow.appendChild(th);
    };
    addTh('Dag');
    activeProjects.forEach(p => addTh(p.name));
    addTh('Totaal');
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = doc.createElement('tbody');
    const projectTotals = {};
    activeProjects.forEach(p => { projectTotals[p.id] = 0; });

    // Helper: alle afgeronde taken voor één project op één dag
    const tasksFor = (day, projectId) => {
      const projData = day.byProject.find(bp => bp.id === projectId);
      if (!projData) return [];
      const out = [];
      projData.sessions.forEach(s => {
        (s.todos || []).filter(t => t.done).forEach(t => out.push(t.text));
      });
      return out;
    };

    dayBlocks.forEach(day => {
      const tr = doc.createElement('tr');

      // Dag-cel
      const dayTd = doc.createElement('td');
      dayTd.className = 'day-cell';
      dayTd.textContent = dayOfWeekNL(day.date) + ' ' + day.date.getDate() + ' ' + monthNL(day.date);
      tr.appendChild(dayTd);

      // Per project: uren bovenin, taken eronder
      activeProjects.forEach(p => {
        const td = doc.createElement('td');
        const item = day.fitted.find(x => x.id === p.id);
        const h = item ? item.hoursFitted : 0;
        projectTotals[p.id] += h;

        if (h > 0) {
          const hrSpan = doc.createElement('span');
          hrSpan.className = 'hours';
          hrSpan.textContent = fmtHours(h);
          td.appendChild(hrSpan);

          const tasks = tasksFor(day, p.id);
          if (tasks.length > 0) {
            const ul = doc.createElement('ul');
            ul.className = 'tasks';
            tasks.forEach(t => {
              const li = doc.createElement('li');
              li.textContent = t;
              ul.appendChild(li);
            });
            td.appendChild(ul);
          }
        } else {
          td.className = 'empty-cell';
          td.textContent = '—';
        }
        tr.appendChild(td);
      });

      // Totaal-cel
      const totalTd = doc.createElement('td');
      totalTd.className = 'total-cell';
      totalTd.textContent = day.totalFitted > 0 ? fmtHours(day.totalFitted) : '—';
      if (day.totalFitted === 0) totalTd.className = 'empty-cell';
      tr.appendChild(totalTd);

      tbody.appendChild(tr);
    });

    // Totaalregel
    const totaalTr = doc.createElement('tr');
    totaalTr.className = 'totaal-row';
    const totaalLabel = doc.createElement('td');
    totaalLabel.textContent = 'Totaal';
    totaalTr.appendChild(totaalLabel);
    activeProjects.forEach(p => {
      const td = doc.createElement('td');
      td.textContent = projectTotals[p.id] > 0 ? fmtHours(projectTotals[p.id]) : '';
      totaalTr.appendChild(td);
    });
    const grandTotalTd = doc.createElement('td');
    grandTotalTd.className = 'total-cell';
    grandTotalTd.textContent = fmtHours(totalFittedAll);
    totaalTr.appendChild(grandTotalTd);
    tbody.appendChild(totaalTr);

    table.appendChild(tbody);
    body.appendChild(table);

    onClose();
  };

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-dialog">
        <div className="modal-header">
          <h3 className="modal-title">Overzicht</h3>
          <button className="icon-btn" onClick={onClose}><Close size={16}/></button>
        </div>
        <p className="modal-subtitle">{label}</p>

        <div className="toggle-group" style={{marginBottom:20}}>
          <button className={`toggle-btn ${period==='today'    ? 'active':''}`} onClick={()=>setPeriod('today')}>Vandaag</button>
          <button className={`toggle-btn ${period==='week'     ? 'active':''}`} onClick={()=>setPeriod('week')}>Deze week</button>
          <button className={`toggle-btn ${period==='lastweek' ? 'active':''}`} onClick={()=>setPeriod('lastweek')}>Vorige week</button>
        </div>

        <div className="export-summary">
          {summaryProjects.length === 0
            ? <div className="export-summary-empty">Geen geregistreerde tijd voor deze periode.</div>
            : <>
                {summaryProjects.map(p => {
                  const col = getProjectColor(p, p._fi ?? 0);
                  return (
                    <div key={p.id} className="export-summary-row">
                      <span className="proj">
                        <span style={{width:7,height:7,borderRadius:'50%',background:col.dot,display:'inline-block',flexShrink:0}}/>
                        {p.name}
                      </span>
                      <span className="hrs">{fmtHours(p.total)}</span>
                    </div>
                  );
                })}
                <div className="export-summary-total">
                  <span className="lbl">Totaal</span>
                  <span className="val">{fmtHours(totalFittedAll)}</span>
                </div>
              </>
          }
        </div>

        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>Annuleer</button>
          <button className="btn btn-primary" onClick={openReport} disabled={summaryProjects.length === 0}>
            Open overzicht ↗
          </button>
        </div>
      </div>
    </div>
  );
}

// =========================================================
// PIP — uitgeklapt
// =========================================================
function PipExpanded({ activeSession, activeProject, activeColor, activeMs, projects, todayPerProject, totalTodayMs, onSwitch, onStop, onCollapse, onClose, onUpdateTodos }) {
  const c = activeColor || { dot: 'var(--text-disabled)', soft: 'transparent', ring: 'var(--border)' };
  return (
    <div style={{background:C.bg,color:C.textPrimary,minHeight:'100vh',padding:14,fontFamily:'"DM Sans",system-ui,sans-serif',boxSizing:'border-box'}}>
      <div style={{background: activeProject ? c.soft : C.surface, border:`1px solid ${activeProject ? c.ring : 'var(--border)'}`, borderRadius:12, padding:'12px 14px', marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <span style={{width:8,height:8,borderRadius:'50%',background:c.dot,boxShadow:activeProject?`0 0 8px ${c.ring}`:'none',flexShrink:0}}/>
          <span style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.1em',color:activeProject?C.textSecondary:C.textMuted,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {activeProject ? activeProject.name : 'Geen actieve timer'}
          </span>
          <button onClick={onCollapse} style={{background:'transparent',border:'none',color:C.textTertiary,cursor:'pointer',padding:4,borderRadius:4,display:'flex',alignItems:'center'}} title="Klap in"><Min size={13}/></button>
          {activeProject && <button onClick={onStop} style={{background:'transparent',border:'none',color:C.danger,cursor:'pointer',padding:4,borderRadius:4,display:'flex',alignItems:'center'}} title="Stop"><Square size={11} fill="currentColor"/></button>}
        </div>
        <div style={{fontFamily:'"Fraunces",serif',fontSize:'2.25rem',fontWeight:400,letterSpacing:'-0.02em',lineHeight:1,color:activeProject?C.textPrimary:C.textDisabled,fontVariantNumeric:'tabular-nums'}}>
          {formatTimer(activeMs)}
        </div>
      </div>
      {activeSession && (
        <PipTodoList
          todos={activeSession.todos || []}
          onChange={(todos) => onUpdateTodos(activeSession.id, todos)}
        />
      )}
      <div style={{display:'flex',flexDirection:'column',gap:2}}>
        {projects.map((p, i) => {
          const col = getProjectColor(p, i);
          const ms = todayPerProject.get(p.id) || 0;
          const isActive = activeProject && activeProject.id === p.id;
          return (
            <button key={p.id} onClick={() => onSwitch(p.id)}
              style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,
                background: isActive ? col.soft : 'transparent',
                border: isActive ? `1px solid ${col.ring}` : '1px solid transparent',
                color: isActive ? C.textPrimary : C.textSecondary,
                fontFamily:'inherit',fontSize:13,cursor:'pointer',textAlign:'left',width:'100%',transition:'background 0.15s'}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:col.dot,flexShrink:0}}/>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</span>
              <span style={{fontSize:11,color:ms > 0 ? C.textTertiary : C.textDisabled,fontVariantNumeric:'tabular-nums'}}>
                {ms > 0 ? formatHM(ms) : '—'}
              </span>
            </button>
          );
        })}
      </div>
      <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.borderLight}`,display:'flex',justifyContent:'space-between',fontSize:11,color:C.textTertiary}}>
        <span style={{textTransform:'uppercase',letterSpacing:'0.1em'}}>Vandaag</span>
        <span style={{fontFamily:'"Fraunces",serif',color:C.textPrimary,fontVariantNumeric:'tabular-nums'}}>
          {formatHM(totalTodayMs)}
        </span>
      </div>
    </div>
  );
}

// =========================================================
// PIP — ingeklapt (alleen pijl + dot)
// =========================================================
function PipCollapsed({ activeColor, onExpand }) {
  return (
    <button className="pip-collapsed" onClick={onExpand} title="Klap uit">
      {activeColor && <span className="pip-collapsed-dot" style={{ background: activeColor.dot, boxShadow: `0 0 6px ${activeColor.ring}`, animation: 'pulse 2s ease-in-out infinite' }} />}
      <ChevL size={20}/>
    </button>
  );
}
